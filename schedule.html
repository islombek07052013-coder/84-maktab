<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sinflar bo'yicha Dars Jadvali — Denov 84-maktab</title>
  <meta name="theme-color" content="#06111e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .class-select-box {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }
    .class-select {
      background: #0d223f;
      color: #fff;
      border: 2px solid var(--color-gold-400);
      padding: 12px 20px;
      font-size: 1.05rem;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      box-shadow: var(--gold-glow);
    }
    .class-select option {
      background: #06111e;
      color: #fff;
    }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Barcha sinflar ro'yxatini yaratish (1-A dan 11-V gacha)
      const letters = ["A", "B", "V"];
      const scheduleData = {};

      for (let c = 1; c <= 11; c++) {
        letters.forEach(letter => {
          const key = `${c}${letter.toLowerCase()}`;
          const isJunior = c <= 4;
          const hoursCount = isJunior ? 5 : 6;
          
          const headers = ["Hafta kuni"];
          for (let h = 1; h <= hoursCount; h++) {
            headers.push(`${h}-soat`);
          }

          let rows = [];
          if (isJunior) {
            rows = [
              ["Dushanba", "Ona tili", "Matematika", "O'qish", "Jismoniy tarbiya", "Odobnoma"],
              ["Seshanba", "Matematika", "Ona tili", "Tabiatshunoslik", "Rasm", "Musiqa"],
              ["Chorshanba", "Ona tili", "Matematika", "O'qish", "Ingliz tili", "Texnologiya"],
              ["Payshanba", "Matematika", "Ona tili", "Musiqa", "Texnologiya", "O'qish"],
              ["Juma", "O'qish", "Matematika", "Jismoniy tarbiya", "Odobnoma", "Ona tili"]
            ];
          } else {
            rows = [
              ["Dushanba", "Algebra", "Fizika", "Ona tili", "Ingliz tili", "Tarix", "Jismoniy tarbiya"],
              ["Seshanba", "Geometriya", "Kimyo", "Biologiya", "Informatika", "Adabiyot", "Huquq"],
              ["Chorshanba", "Fizika", "Algebra", "Ingliz tili", "Tarix", "Geografiya", "Tarbiya"],
              ["Payshanba", "Ona tili", "Geometriya", "Biologiya", "Informatika", "Kimyo", "Iqtisod"],
              ["Juma", "Ingliz tili", "Algebra", "Fizika", "Adabiyot", "ChQBT", "Jismoniy tarbiya"]
            ];
          }

          scheduleData[key] = {
            title: `${c}-'${letter}' Sinfi Dars Jadvali (${isJunior ? "Boshlang'ich - 5 soat" : "Yuqori/O'rta - 6 soat"})`,
            headers: headers,
            rows: rows
          };
        });
      }

      function renderSchedule(groupKey) {
        const box = document.getElementById('schedContent');
        if (!box) return;
        const data = scheduleData[groupKey];
        if (!data) return;

        let html = `<h4 style="margin-bottom: 15px; color: var(--color-gold-300); font-weight: 700; font-size: 1.2rem;">📌 ${data.title}</h4>`;
        html += `<div style="overflow-x: auto;"><table class="sched-table"><thead><tr>`;
        
        data.headers.forEach(h => html += `<th>${h}</th>`);
        html += `</tr></thead><tbody>`;

        data.rows.forEach(row => {
          html += `<tr>`;
          row.forEach(cell => html += `<td>${cell}</td>`);
          html += `</tr>`;
        });

        html += `</tbody></table></div>`;
        box.innerHTML = html;
      }

      const classPicker = document.getElementById('classPicker');
      if (classPicker) {
        classPicker.addEventListener('change', (e) => {
          renderSchedule(e.target.value);
        });
      }

      renderSchedule('1a');
    });
  </script>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="84-maktab — bosh sahifaga o'tish">
        <span class="logo-badge">84</span>
        <span class="logo-text">maktab<small>Denov tumani</small></span>
      </a>
      <nav class="main-nav" aria-label="Asosiy navigatsiya">
        <ul>
          <li><a href="index.html">⬅️ Bosh sahifaga qaytish</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main style="padding: 50px 0;">
    <div class="container">
      <h2 class="section-heading">Sinflar bo'yicha Dars Jadvali</h2>
      
      <!-- Tanlash Menyusi (1-A dan 11-V gacha) -->
      <div class="class-select-box">
        <label for="classPicker" style="font-weight: 700; color: var(--color-gold-300); font-size: 1.1rem;">Sinfni tanlang:</label>
        <select id="classPicker" class="class-select">
          <optgroup label="1-Sinf">
            <option value="1a">1-"A" Sinf</option>
            <option value="1b">1-"B" Sinf</option>
            <option value="1v">1-"V" Sinf</option>
          </optgroup>
          <optgroup label="2-Sinf">
            <option value="2a">2-"A" Sinf</option>
            <option value="2b">2-"B" Sinf</option>
            <option value="2v">2-"V" Sinf</option>
          </optgroup>
          <optgroup label="3-Sinf">
            <option value="3a">3-"A" Sinf</option>
            <option value="3b">3-"B" Sinf</option>
            <option value="3v">3-"V" Sinf</option>
          </optgroup>
          <optgroup label="4-Sinf">
            <option value="4a">4-"A" Sinf</option>
            <option value="4b">4-"B" Sinf</option>
            <option value="4v">4-"V" Sinf</option>
          </optgroup>
          <optgroup label="5-Sinf">
            <option value="5a">5-"A" Sinf</option>
            <option value="5b">5-"B" Sinf</option>
            <option value="5v">5-"V" Sinf</option>
          </optgroup>
          <optgroup label="6-Sinf">
            <option value="6a">6-"A" Sinf</option>
            <option value="6b">6-"B" Sinf</option>
            <option value="6v">6-"V" Sinf</option>
          </optgroup>
          <optgroup label="7-Sinf">
            <option value="7a">7-"A" Sinf</option>
            <option value="7b">7-"B" Sinf</option>
            <option value="7v">7-"V" Sinf</option>
          </optgroup>
          <optgroup label="8-Sinf">
            <option value="8a">8-"A" Sinf</option>
            <option value="8b">8-"B" Sinf</option>
            <option value="8v">8-"V" Sinf</option>
          </optgroup>
          <optgroup label="9-Sinf">
            <option value="9a">9-"A" Sinf</option>
            <option value="9b">9-"B" Sinf</option>
            <option value="9v">9-"V" Sinf</option>
          </optgroup>
          <optgroup label="10-Sinf">
            <option value="10a">10-"A" Sinf</option>
            <option value="10b">10-"B" Sinf</option>
            <option value="10v">10-"V" Sinf</option>
          </optgroup>
          <optgroup label="11-Sinf">
            <option value="11a">11-"A" Sinf</option>
            <option value="11b">11-"B" Sinf</option>
            <option value="11v">11-"V" Sinf</option>
          </optgroup>
        </select>

        <button type="button" onclick="window.print()" class="print-btn">🖨️ Chop etish / PDF</button>
      </div>

      <div id="schedContent" class="schedule-content-box"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <div class="container">
        <p>&copy; 2026 Denov 84-umumiy o'rta ta'lim maktabi. Barcha huquqlar himoyalangan.</p>
        <p style="margin-top: 8px; font-size: 0.95rem; color: #cda059; font-weight: 700;">Sayt yaratuvchisi: Islom Xikmatullayev</p>
      </div>
    </div>
  </footer>

</body>
</html>
