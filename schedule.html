<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sinflar bo'yicha Dars Jadvali — Denov 84-maktab</title>
  <meta name="theme-color" content="#06111e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .class-select-box {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }
    .class-select {
      background: #0d223f;
      color: #fff;
      border: 2px solid var(--color-gold-400, #cda059);
      padding: 12px 20px;
      font-size: 1.05rem;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      outline: none;
    }
    .class-select option {
      background: #06111e;
      color: #fff;
    }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      function renderSchedule(selectedClass) {
        const box = document.getElementById('schedContent');
        if (!box) return;

        // Admin paneldan keluvchi ma'lumotlar bazasi
        const savedSchedules = localStorage.getItem('school_schedules_v3');
        let schedules = [];

        if (savedSchedules) {
          schedules = JSON.parse(savedSchedules);
        }

        // Sinflar bo'yicha qidirib topish
        const classSchedules = schedules.filter(s => s.class_name.toLowerCase() === selectedClass.toLowerCase());

        let html = `<h4 style="margin-bottom: 15px; color: var(--color-gold-300, #f3e5ab); font-weight: 700; font-size: 1.2rem;">📌 ${selectedClass} Dars Jadvali</h4>`;
        
        if (classSchedules.length === 0) {
          html += `<p style="color: #cbd5e1; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 10px; text-align: center;">Hozircha bu sinf uchun admin paneldan dars jadvali kiritilmagan.</p>`;
        } else {
          html += `<div style="overflow-x: auto;"><table class="sched-table"><thead><tr>`;
          html += `<th>Hafta kuni</th><th>Darslar ro'yxati</th></tr></thead><tbody>`;

          classSchedules.forEach(item => {
            html += `<tr>`;
            html += `<td><strong style="color:var(--color-gold-300, #f3e5ab);">${item.day}</strong></td>`;
            html += `<td><pre style="font-family:inherit; white-space:pre-wrap; margin:0;">${item.lessons}</pre></td>`;
            html += `</tr>`;
          });

          html += `</tbody></table></div>`;
        }

        box.innerHTML = html;
      }

      const classPicker = document.getElementById('classPicker');
      if (classPicker) {
        renderSchedule(classPicker.value);

        classPicker.addEventListener('change', (e) => {
          renderSchedule(e.target.value);
        });
      }
    });
  </script>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="84-maktab — bosh sahifaga o'tish">
        <span class="logo-badge">84</span>
        <span class="logo-text">maktab<small>Denov tumani</small></span>
      </a>
      <nav class="main-nav" aria-label="Asosiy navigatsiya">
        <ul>
          <li><a href="index.html">⬅️ Bosh sahifaga qaytish</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main style="padding: 50px 0;">
    <div class="container">
      <h2 class="section-heading">Sinflar bo'yicha Dars Jadvali</h2>
      
      <!-- Tanlash Menyusi -->
      <div class="class-select-box">
        <label for="classPicker" style="font-weight: 700; color: var(--color-gold-300, #f3e5ab); font-size: 1.1rem;">Sinfni tanlang:</label>
        <select id="classPicker" class="class-select">
          <optgroup label="1-Sinf">
            <option value="1-A sinf">1-"A" Sinf</option>
            <option value="1-B sinf">1-"B" Sinf</option>
            <option value="1-V sinf">1-"V" Sinf</option>
          </optgroup>
          <optgroup label="2-Sinf">
            <option value="2-A sinf">2-"A" Sinf</option>
            <option value="2-B sinf">2-"B" Sinf</option>
            <option value="2-V sinf">2-"V" Sinf</option>
          </optgroup>
          <optgroup label="3-Sinf">
            <option value="3-A sinf">3-"A" Sinf</option>
            <option value="3-B sinf">3-"B" Sinf</option>
            <option value="3-V sinf">3-"V" Sinf</option>
          </optgroup>
          <optgroup label="4-Sinf">
            <option value="4-A sinf">4-"A" Sinf</option>
            <option value="4-B sinf">4-"B" Sinf</option>
            <option value="4-V sinf">4-"V" Sinf</option>
          </optgroup>
          <optgroup label="5-Sinf">
            <option value="5-A sinf">5-"A" Sinf</option>
            <option value="5-B sinf">5-"B" Sinf</option>
            <option value="5-V sinf">5-"V" Sinf</option>
          </optgroup>
          <optgroup label="6-Sinf">
            <option value="6-A sinf">6-"A" Sinf</option>
            <option value="6-B sinf">6-"B" Sinf</option>
            <option value="6-V sinf">6-"V" Sinf</option>
          </optgroup>
          <optgroup label="7-Sinf">
            <option value="7-A sinf">7-"A" Sinf</option>
            <option value="7-B sinf">7-"B" Sinf</option>
            <option value="7-V sinf">7-"V" Sinf</option>
          </optgroup>
          <optgroup label="8-Sinf">
            <option value="8-A sinf">8-"A" Sinf</option>
            <option value="8-B sinf">8-"B" Sinf</option>
            <option value="8-V sinf">8-"V" Sinf</option>
          </optgroup>
          <optgroup label="9-Sinf">
            <option value="9-A sinf">9-"A" Sinf</option>
            <option value="9-B sinf">9-"B" Sinf</option>
            <option value="9-V sinf">9-"V" Sinf</option>
          </optgroup>
          <optgroup label="10-Sinf">
            <option value="10-A sinf">10-"A" Sinf</option>
            <option value="10-B sinf">10-"B" Sinf</option>
            <option value="10-V sinf">10-"V" Sinf</option>
          </optgroup>
          <optgroup label="11-Sinf">
            <option value="11-A sinf">11-"A" Sinf</option>
            <option value="11-B sinf">11-"B" Sinf</option>
            <option value="11-V sinf">11-"V" Sinf</option>
          </optgroup>
        </select>

        <button type="button" onclick="window.print()" class="btn btn-primary" style="padding: 10px 20px; font-size: 1rem;">🖨️ Chop etish / PDF</button>
      </div>

      <div id="schedContent" class="schedule-content-box"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <div class="container" style="text-align: center;">
        <p>&copy; 2026 Denov 84-umumiy o'rta ta'lim maktabi. Barcha huquqlar himoyalangan.</p>
        <p style="margin-top: 8px; font-size: 0.95rem; color: var(--color-gold-300, #f3e5ab); font-weight: 700;">Sayt yaratuvchisi: Islom Xikmatullayev</p>
      </div>
    </div>
  </footer>

</body>
</html>
