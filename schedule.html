<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sinflar bo'yicha Dars Jadvali — Denov 84-maktab</title>
  <meta name="theme-color" content="#06111e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const scheduleData = {
        "1a": {
          title: "1-'A' Sinfi Dars Jadvali (Boshlang'ich - 5 soat)",
          headers: ["Hafta kuni", "1-soat", "2-soat", "3-soat", "4-soat", "5-soat"],
          rows: [
            ["Dushanba", "Ona tili", "Matematika", "O'qish", "Jismoniy tarbiya", "Odobnoma"],
            ["Seshanba", "Matematika", "Ona tili", "Tabiatshunoslik", "Rasm", "Musiqa"],
            ["Chorshanba", "Ona tili", "Matematika", "O'qish", "Ingliz tili", "Texnologiya"],
            ["Payshanba", "Matematika", "Ona tili", "Musiqa", "Texnologiya", "O'qish"],
            ["Juma", "O'qish", "Matematika", "Jismoniy tarbiya", "Odobnoma", "Ona tili"]
          ]
        },
        "1b": {
          title: "1-'B' Sinfi Dars Jadvali (Boshlang'ich - 5 soat)",
          headers: ["Hafta kuni", "1-soat", "2-soat", "3-soat", "4-soat", "5-soat"],
          rows: [
            ["Dushanba", "Matematika", "Ona tili", "O'qish", "Odobnoma", "Jismoniy tarbiya"],
            ["Seshanba", "Ona tili", "Matematika", "Rasm", "Tabiatshunoslik", "Musiqa"],
            ["Chorshanba", "Matematika", "Ona tili", "Ingliz tili", "O'qish", "Texnologiya"],
            ["Payshanba", "Ona tili", "Matematika", "Texnologiya", "Musiqa", "O'qish"],
            ["Juma", "Matematika", "O'qish", "Jismoniy tarbiya", "Ona tili", "Odobnoma"]
          ]
        },
        "5a": {
          title: "5-'A' Sinfi Dars Jadvali (O'rta bo'g'in - 6 soat)",
          headers: ["Hafta kuni", "1-soat", "2-soat", "3-soat", "4-soat", "5-soat", "6-soat"],
          rows: [
            ["Dushanba", "Matematika", "Ona tili", "Fizika", "Ingliz tili", "Tarix", "Jismoniy tarbiya"],
            ["Seshanba", "Adabiyot", "Matematika", "Biologiya", "Informatika", "Geografiya", "Rus tili"],
            ["Chorshanba", "Fizika", "Kimyo", "Matematika", "Ingliz tili", "Ona tili", "Tarbiya"],
            ["Payshanba", "Tarix", "Geografiya", "Matematika", "Adabiyot", "Informatika", "Biologiya"],
            ["Juma", "Ingliz tili", "Kimyo", "Ona tili", "Fizika", "Jismoniy tarbiya", "Musiqa"]
          ]
        },
        "9a": {
          title: "9-'A' Sinfi Dars Jadvali (O'rta bo'g'in - 6 soat)",
          headers: ["Hafta kuni", "1-soat", "2-soat", "3-soat", "4-soat", "5-soat", "6-soat"],
          rows: [
            ["Dushanba", "Algebra", "Geometriya", "Ona tili", "Ingliz tili", "Kimyo", "Tarix"],
            ["Seshanba", "Fizika", "Adabiyot", "Biologiya", "Informatika", "Geografiya", "Huquq"],
            ["Chorshanba", "Ona tili", "Algebra", "Ingliz tili", "Fizika", "Tarix", "Jismoniy tarbiya"],
            ["Payshanba", "Geometriya", "Kimyo", "Biologiya", "Informatika", "Adabiyot", "Tarbiya"],
            ["Juma", "Ingliz tili", "Algebra", "Fizika", "Ona tili", "Jismoniy tarbiya", "Iqtisod"]
          ]
        },
        "10a": {
          title: "10-'A' Sinfi Dars Jadvali (Yuqori sinf - 6 soat)",
          headers: ["Hafta kuni", "1-soat", "2-soat", "3-soat", "4-soat", "5-soat", "6-soat"],
          rows: [
            ["Dushanba", "Algebra", "Fizika", "Ingliz tili", "Ona tili", "Kimyo", "Tarix"],
            ["Seshanba", "Geometriya", "Kimyo", "Biologiya", "Informatika", "Adabiyot", "Huquq"],
            ["Chorshanba", "Fizika", "Algebra", "Ingliz tili", "Tarix", "Geografiya", "Jismoniy tarbiya"],
            ["Payshanba", "Ona tili", "Geometriya", "Biologiya", "Informatika", "Kimyo", "Iqtisod"],
            ["Juma", "Ingliz tili", "Algebra", "Fizika", "Adabiyot", "ChQBT", "Jismoniy tarbiya"]
          ]
        }
      };

      function renderSchedule(groupKey) {
        const box = document.getElementById('schedContent');
        if (!box) return;
        const data = scheduleData[groupKey];
        if (!data) return;

        let html = `<h4 style="margin-bottom: 15px; color: var(--color-gold-300); font-weight: 700;">📌 ${data.title}</h4>`;
        html += `<div style="overflow-x: auto;"><table class="sched-table"><thead><tr>`;
        
        data.headers.forEach(h => html += `<th>${h}</th>`);
        html += `</tr></thead><tbody>`;

        data.rows.forEach(row => {
          html += `<tr>`;
          row.forEach(cell => html += `<td>${cell}</td>`);
          html += `</tr>`;
        });

        html += `</tbody></table></div>`;
        box.innerHTML = html;
      }

      const schedBtns = document.querySelectorAll('.sched-btn');
      schedBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          schedBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const classKey = btn.getAttribute('data-class');
          renderSchedule(classKey);
        });
      });

      renderSchedule('1a');
    });
  </script>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="84-maktab — bosh sahifaga o'tish">
        <span class="logo-badge">84</span>
        <span class="logo-text">maktab<small>Denov tumani</small></span>
      </a>
      <nav class="main-nav" aria-label="Asosiy navigatsiya">
        <ul>
          <li><a href="index.html">⬅️ Bosh sahifaga qaytish</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main style="padding: 50px 0;">
    <div class="container">
      <h2 class="section-heading">Sinflar bo'yicha Dars Jadvali</h2>
      
      <!-- Sinflar tugmalari -->
      <div class="schedule-filter">
        <button type="button" class="sched-btn active" data-class="1a">1-"A" Sinf</button>
        <button type="button" class="sched-btn" data-class="1b">1-"B" Sinf</button>
        <button type="button" class="sched-btn" data-class="5a">5-"A" Sinf</button>
        <button type="button" class="sched-btn" data-class="9a">9-"A" Sinf</button>
        <button type="button" class="sched-btn" data-class="10a">10-"A" Sinf</button>
        <button type="button" onclick="window.print()" class="print-btn">🖨️ Chop etish / PDF</button>
      </div>

      <div id="schedContent" class="schedule-content-box"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <div class="container">
        <p>&copy; 2026 Denov 84-umumiy o'rta ta'lim maktabi.</p>
      </div>
    </div>
  </footer>

</body>
</html>
